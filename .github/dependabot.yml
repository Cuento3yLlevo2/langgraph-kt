version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    ignore:
      # vitepress-plugin-mermaid sets which major versions of Mermaid it works with. Move to a new
      # one by hand, when the plugin allows it.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
