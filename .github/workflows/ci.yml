name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, lint and verify API
        run: ./gradlew check apiCheck koverXmlReport --continue
      # The docs and release workflows only run on main and on a tag, so build what they build here too.
      - name: Build the API docs and the publications
        run: ./gradlew dokkaGenerate publishToMavenLocal
      # Maven Central rejects a POM without these elements, and nothing else fails before the release.
      - name: Check that every POM has what Maven Central requires
        run: |
          for pom in */build/publications/*/pom-default.xml; do
            for tag in name description url licenses developers scm; do
              grep -q "^  <$tag>" "$pom" || { echo "::error file=$pom::<$tag> is missing"; exit 1; }
            done
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: '**/build/reports/'

  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release is built on macOS and runs this check first. Running the same check here
          # shows a failure on a pull request, not after the tag is pushed. The job keeps its name
          # because the protection of main requires it.
          - os: macos-latest
            tasks: check apiCheck
          - os: windows-latest
            tasks: mingwX64Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Run native tests
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/'
