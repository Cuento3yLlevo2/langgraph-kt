name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, lint and verify API
        run: ./gradlew check apiCheck koverXmlReport --continue
      # The docs and release workflows only run on main and on a tag, so build what they build here too.
      - name: Build the API docs and the publications
        run: ./gradlew dokkaGenerate publishToMavenLocal
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-linux
          path: '**/build/reports/'

  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tasks: iosSimulatorArm64Test macosArm64Test
          - os: windows-latest
            tasks: mingwX64Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Run native tests
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} --continue
